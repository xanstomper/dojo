name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: DOJO smoke suite
        run: |
          set -e
          python3 -m py_compile scripts/dojo.py
          python3 scripts/dojo.py verify | grep -q 'ALL PASS'
          python3 scripts/dojo.py catalog | grep -q '9 buildable'
          python3 scripts/dojo.py teach --class REPLAY | grep -q 'DOJO LESSON'
          python3 scripts/dojo.py teach --class bogus 2>/dev/null || test $? -eq 2
          '! grep -E "^[[:space:]]*(import|from)[[:space:]]+(requests|flask|httpx|aiohttp|urllib3)" scripts/dojo.py'
